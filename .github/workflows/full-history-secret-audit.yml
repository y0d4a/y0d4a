name: Full-history secret audit

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  GITLEAKS_VERSION: "8.30.1"
  TRUFFLEHOG_VERSION: "3.95.2"

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Prepare scanner workspace
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/secret-audit"/{repos,raw,normalized,encrypted}

      - name: Install pinned Gitleaks
        shell: bash
        working-directory: ${{ runner.temp }}/secret-audit
        run: |
          set -euo pipefail
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl --proto '=https' --tlsv1.2 -fsSLO "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  ${archive}" | sha256sum -c -
          tar -xzf "$archive" gitleaks
          chmod 0755 gitleaks
          ./gitleaks version

      - name: Pull pinned TruffleHog image
        shell: bash
        run: |
          set -euo pipefail
          docker pull "trufflesecurity/trufflehog:${TRUFFLEHOG_VERSION}" >/dev/null

      - name: Scan all source repositories and full Git history
        shell: bash
        working-directory: ${{ runner.temp }}/secret-audit
        run: |
          set -euo pipefail

          repos=(
            powertools
            calm-factory
            tor-loop-visit
            y0d4a
            ComputerScienceEngineering
            snowtricks2019
            rat
            y0d4a.github.io
            crypto
            mob
            PSLabHelpers
            JMBG-regex
            mitm-ssl
            vip
            mass-shodan-queries
            OWFuzz
            Add-line-to-HOSTS-file
          )

          printf '%s\n' "${repos[@]}" > normalized/repositories.txt
          : > normalized/status.tsv

          for repo in "${repos[@]}"; do
            echo "Scanning ${repo}"
            mirror="$PWD/repos/${repo}.git"

            if ! git clone --mirror --quiet "https://github.com/y0d4a/${repo}.git" "$mirror" 2>"raw/${repo}.clone.stderr"; then
              printf '%s\tclone_failed\n' "$repo" >> normalized/status.tsv
              continue
            fi

            printf '%s\tcloned\n' "$repo" >> normalized/status.tsv

            set +e
            "$PWD/gitleaks" git "$mirror" \
              --no-banner \
              --exit-code 0 \
              --redact=100 \
              --report-format json \
              --report-path "$PWD/raw/${repo}.gitleaks.json" \
              >"raw/${repo}.gitleaks.stdout" 2>"raw/${repo}.gitleaks.stderr"
            gitleaks_rc=$?

            docker run --rm \
              -v "$PWD:/audit:rw" \
              "trufflesecurity/trufflehog:${TRUFFLEHOG_VERSION}" \
              git "file:///audit/repos/${repo}.git" \
              --json \
              --no-update \
              --no-verification \
              >"raw/${repo}.trufflehog.jsonl" 2>"raw/${repo}.trufflehog.stderr"
            trufflehog_rc=$?
            set -e

            printf '%s\tgitleaks_rc=%s\ttrufflehog_rc=%s\n' "$repo" "$gitleaks_rc" "$trufflehog_rc" >> normalized/status.tsv
          done

      - name: Redact and normalize findings
        shell: bash
        working-directory: ${{ runner.temp }}/secret-audit
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import datetime
          import hashlib
          import json
          import pathlib

          root = pathlib.Path('.')
          repos = [x.strip() for x in (root/'normalized/repositories.txt').read_text().splitlines() if x.strip()]
          status_lines = (root/'normalized/status.tsv').read_text(errors='replace').splitlines()
          status = {}
          for line in status_lines:
              parts = line.split('\t')
              if not parts:
                  continue
              status.setdefault(parts[0], []).append(parts[1:])

          def dig(obj, *paths):
              for path in paths:
                  cur = obj
                  ok = True
                  for key in path:
                      if isinstance(cur, dict) and key in cur:
                          cur = cur[key]
                      else:
                          ok = False
                          break
                  if ok:
                      return cur
              return None

          report = {
              'generated_at_utc': datetime.datetime.now(datetime.timezone.utc).isoformat(),
              'scope': 'full Git history of public, non-fork repositories owned by y0d4a',
              'verification': 'disabled; no discovered credential was sent to a provider',
              'raw_secrets_retained': False,
              'tools': {
                  'gitleaks': '8.30.1',
                  'trufflehog': '3.95.2',
              },
              'repositories': [],
          }

          for repo in repos:
              entry = {
                  'repository': f'y0d4a/{repo}',
                  'status': status.get(repo, []),
                  'gitleaks': [],
                  'trufflehog': [],
              }

              gp = root/f'raw/{repo}.gitleaks.json'
              if gp.exists() and gp.stat().st_size:
                  try:
                      data = json.loads(gp.read_text(errors='replace'))
                  except Exception as exc:
                      entry['gitleaks_parse_error'] = type(exc).__name__
                      data = []
                  for finding in data if isinstance(data, list) else []:
                      entry['gitleaks'].append({
                          'rule_id': finding.get('RuleID'),
                          'description': finding.get('Description'),
                          'file': finding.get('File'),
                          'start_line': finding.get('StartLine'),
                          'end_line': finding.get('EndLine'),
                          'commit': finding.get('Commit'),
                          'date': finding.get('Date'),
                          'fingerprint': finding.get('Fingerprint'),
                      })

              tp = root/f'raw/{repo}.trufflehog.jsonl'
              if tp.exists() and tp.stat().st_size:
                  for line_no, line in enumerate(tp.read_text(errors='replace').splitlines(), 1):
                      try:
                          finding = json.loads(line)
                      except Exception:
                          continue
                      raw = finding.get('Raw') or finding.get('RawV2') or ''
                      if isinstance(raw, str):
                          raw_bytes = raw.encode('utf-8', errors='replace')
                      else:
                          raw_bytes = json.dumps(raw, sort_keys=True).encode()
                      source = finding.get('SourceMetadata') or {}
                      entry['trufflehog'].append({
                          'detector': finding.get('DetectorName'),
                          'decoder': finding.get('DecoderName'),
                          'verified': bool(finding.get('Verified', False)),
                          'secret_sha256_prefix': hashlib.sha256(raw_bytes).hexdigest()[:16],
                          'commit': dig(source, ('Data','Git','commit'), ('data','git','commit')),
                          'file': dig(source, ('Data','Git','file'), ('data','git','file')),
                          'line': dig(source, ('Data','Git','line'), ('data','git','line')),
                          'timestamp': dig(source, ('Data','Git','timestamp'), ('data','git','timestamp')),
                      })

              entry['summary'] = {
                  'gitleaks_findings': len(entry['gitleaks']),
                  'trufflehog_findings': len(entry['trufflehog']),
              }
              report['repositories'].append(entry)

          report['summary'] = {
              'repositories_requested': len(repos),
              'repositories_with_gitleaks_findings': sum(bool(x['gitleaks']) for x in report['repositories']),
              'repositories_with_trufflehog_findings': sum(bool(x['trufflehog']) for x in report['repositories']),
              'gitleaks_findings': sum(len(x['gitleaks']) for x in report['repositories']),
              'trufflehog_findings': sum(len(x['trufflehog']) for x in report['repositories']),
          }

          (root/'normalized/report.json').write_text(json.dumps(report, indent=2, sort_keys=True))
          PY

          # Delete all raw scanner output before packaging. It may contain discovered values.
          rm -rf raw repos

      - name: Encrypt report for out-of-band review
        shell: bash
        working-directory: ${{ runner.temp }}/secret-audit
        run: |
          set -euo pipefail
          cat > public.pem <<'PEM'
          -----BEGIN PUBLIC KEY-----
          MIICIjANBgkqhkiG9w0BAQEFAAOCAg8AMIICCgKCAgEAuSCDLVU2So8uBo7ZZ9Ej
          MwyQ4ggfUFI2aDxIBQMZVTSPMjTNrafgF4f9RjCsjug0G6qUzAn6K77xq30ZX4Xn
          2beqAfXFhKQroiAdoacAVaHMk+MiXvFx6teu9CMQ4KMKN/OhH3EFCObBo1hH7hx5
          pdHp7SbooFZqEbGih7pnTvzro2KiNZbBG9LuFpcK7jhPppla9cX95BTK1TDy4Sq+
          objp5gkSLz8J43MGKDdljjEi0AaH8iw2RNZAGWCfb3zXjW976GrEchtEXftlSl/F
          9fD2AVIJpwP+hqXlJFVi0dkCoNicS2GvZAFjHXvhJmtvSVYMQ98dSFWCo5wRBAxP
          tDTtFgWFYDOfxMhxZjI86Mh6Cx/1QQshzE7A1Yc/yfaO/bT+x4J6BIoboiX5p1Ru
          QA+3GjCNmW8MG9QGUD0WHta/CdHfJzRXcCXJWBjzh6tofPtoc4OLg1Y2IbQ1ONNa
          8dBt6qa97H8D4uwyYKHEou0aCh9BP2w8Z7g8N2lbs6kokXrUz5VeoKkTK2kaFUSl
          06XEWBITMJv2+fpJ+e8BCz+G66eOjAt5ORe4/KnXynfyGNJtdb05AKQL100+j2ze
          HJ4dYY7JdXuK3QDfiPywfVO0j6ZtXdGp1srnOl6IYcelB4Dq7dgzcXdzZtvvKGvt
          QqhT0s+gkSWNwsNceXTVNeECAwEAAQ==
          -----END PUBLIC KEY-----
          PEM

          tar -C normalized -czf encrypted/report.tar.gz report.json status.tsv repositories.txt
          openssl rand -base64 48 > encrypted/report.pass
          openssl enc -aes-256-cbc -salt -pbkdf2 -iter 250000 \
            -in encrypted/report.tar.gz \
            -out encrypted/report.tar.gz.enc \
            -pass file:encrypted/report.pass
          openssl pkeyutl -encrypt -pubin -inkey public.pem \
            -pkeyopt rsa_padding_mode:oaep \
            -pkeyopt rsa_oaep_md:sha256 \
            -in encrypted/report.pass \
            -out encrypted/report.pass.enc
          rm -rf normalized public.pem encrypted/report.pass encrypted/report.tar.gz
          sha256sum encrypted/report.tar.gz.enc encrypted/report.pass.enc > encrypted/SHA256SUMS

      - name: Upload encrypted report only
        uses: actions/upload-artifact@v4
        with:
          name: encrypted-full-history-secret-audit
          path: ${{ runner.temp }}/secret-audit/encrypted/
          if-no-files-found: error
          retention-days: 1
